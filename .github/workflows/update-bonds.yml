name: Update secondary bond trading

on:
  workflow_dispatch:
  schedule:
    # 16:20 UTC on weekdays (~17:20 Serbia winter / 18:20 summer).
    - cron: '20 16 * * 1-5'

permissions:
  contents: write

concurrency:
  group: secondary-bond-trading
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download official Excel and calculate report
        run: python3 build_report.py --output-dir .
      - name: Commit report only when source data changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.md latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update secondary bond trading report'
            git push
          else
            echo 'No change in official trading data.'
          fi
